[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "toke-model"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Matthew Watt"}]

[project.optional-dependencies]
cuda = [
    "torch>=2.1",
    "transformers>=4.36",
    "peft>=0.7",
    "bitsandbytes>=0.41",
    "datasets>=2.14",
    "accelerate>=0.25",
]
mlx = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
    "pyyaml>=6",
]
dev = [
    "pytest>=7",
    # Pinned to one minor on purpose (story 130.24, as 130.19 did for toke-tokenizer):
    # ruff's DEFAULT rule set grows between minors, so an unpinned `ruff>=0.4` makes the
    # CI lint step pass or fail by calendar date rather than by the code.
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
    # Typed dep that the checked sources import (tokenizer/eval.py, tests): mypy must see
    # the same numpy types in CI as locally, not degrade them to Any (130.24, as 130.19).
    "numpy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

# Training-box / optional dependencies (story 130.24). None of these is in the `dev` extra
# that CI installs, and some are installed on one machine and not another (torch and
# sentencepiece locally, peft/datasets/mlx_lm only on a training box, gradio only on the
# Space). Left to default, mypy's verdict would depend on which machine ran it: a typed
# package that happens to be installed (torch, mlx) is analysed in full, an absent one is
# an import error. `follow_imports = "skip"` + `ignore_missing_imports` makes every one of
# them `Any` everywhere, so `mypy .` gives the same result in CI as locally.
# `phase2_syntax_audit` is a toke-corpus script put on sys.path at runtime, not a package.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "gradio.*",
    "mlx.*",
    "mlx_lm.*",
    "peft.*",
    "phase2_syntax_audit",
    "scipy.*",
    "sentencepiece.*",
    "tiktoken.*",
    "tokenizers.*",
    "torch.*",
    "transformers.*",
    "yaml.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# model/model.py defines its layers as subclasses of `nn.Module` from mlx or torch, which
# the override above makes `Any` on purpose; subclassing it is the design, not an accident.
[[tool.mypy.overrides]]
module = ["model.model"]
disallow_subclassing_any = false
