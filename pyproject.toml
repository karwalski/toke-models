[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "toke-model"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Matthew Watt"}]

[project.optional-dependencies]
cuda = [
    "torch>=2.1",
    "transformers>=4.36",
    "peft>=0.7",
    "bitsandbytes>=0.41",
    "datasets>=2.14",
    "accelerate>=0.25",
]
mlx = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
    "pyyaml>=6",
]
dev = [
    "pytest>=7",
    # Pinned to one minor on purpose (story 130.24, as 130.19 did for toke-tokenizer):
    # ruff's DEFAULT rule set grows between minors, so an unpinned `ruff>=0.4` makes the
    # CI lint step pass or fail by calendar date rather than by the code.
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
